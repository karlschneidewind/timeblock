name: Timeblock
options:
  bundleIdPrefix: com.karlschneidewind
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Timeblock:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Timeblock
    info:
      path: Timeblock/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.karlschneidewind.timeblock
        PRODUCT_NAME: Timeblock
        INFOPLIST_FILE: Timeblock/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
